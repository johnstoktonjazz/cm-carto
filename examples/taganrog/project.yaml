# Город-полигон картографа (DECISIONS.md, К-001). Анкета в той же форме, что у проектов CM;
# здесь — только часть картографа. Данные открытые или синтетические, персональных данных нет.
name: Таганрог, полигон картографа
crs:
  name: EPSG:32637
  definition: EPSG:32637        # UTM 37N; у проектов CM — МСК субъекта строкой PROJ или WKT
extent: [486360, 5226270, 498490, 5236300]   # город целиком, в системе координат проекта (метры)
extent_wgs84: [38.82, 47.19, 38.98, 47.28]   # охват выгрузок внешних источников (на него снят кеш)
language: ru                    # язык названий на картах и в слоях
geo: geo                        # геопакет и его части
inputs: ../../input/taganrog    # образцы DXF и КПТ, кеш внешних источников с датой и лицензией
fetch:
  overture_release: 2026-09-23.0   # выпуск Overture Maps для fetch overture; кеш — inputs/cache/overture-<выпуск>/
