notes: >
  Образец К1, карта 3: сравнение двух карт одного охвата и масштаба (1:20 000, место square_small) с одной легендой
  91 мм (легенда карты 3a; легенды обеих карт совпадают байт в байт). cm-carto render по
  examples/taganrog/maps/k1-compare-a.yaml и k1-compare-b.yaml. Счет — заготовки CALC сверки источников (T2.4):
  до расчета «необходим расчет». После этапа анализа варианты сравнения — изохроны 5 и 10 минут пешком.
