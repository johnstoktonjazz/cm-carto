notes: >
  Образец К1, карта 3: сравнение двух карт одного масштаба (1:30 000, место square_small) с одной легендой
  (compare_with, легенды двух overlay совпадают). cm-carto render по examples/taganrog/maps/k1-compare-a.yaml
  и k1-compare-b.yaml; overlay.json верстка читает напрямую, подписи карт — из provenance. Счет школ и садов —
  объекты на карте внутри изохроны walk-15 от станции; площадь и длина улиц — analysis-isochrones.calc.yaml
  (status check). CALC-00011…00018 — условные идентификаторы: базы знаний у полигона нет.
