notes: >
  Образец К1, карта 1: аналитическая карта на полигоне (Таганрог). Подложка, provenance и overlay.json (контракт
  overlay 1.0.0) — cm-carto render по examples/taganrog/maps/k1-analysis.yaml (место landscape, легенда 123 мм,
  1:11 000); k1-analysis.deck-overlay.json — временный перевод для cm-deck (cm_carto/render/deck_overlay.py), пока
  верстка разбирает свой черновой формат. Счет — число объектов на карте внутри изохроны walk-10 от границы ППТ
  (analysis-isochrones), status check. Расстояние до ближайшего не считалось — «необходим расчет».
  CALC-00001…00006 и ASM-0001 — условные идентификаторы: базы знаний у полигона нет.
