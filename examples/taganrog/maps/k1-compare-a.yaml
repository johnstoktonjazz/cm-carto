# К1, карта 3a: сравнение под макет compare (место square_small, легенда 91 мм — одна на обе карты, на листе — карты 3a).
# 15 минут пешком от станции Таганрог-II: школы и сады внутри изохроны. Масштаб общий с соседней картой (1:30 000 —
# помещается большая из двух изохрон), центр — свой, по изохроне. Станция — роль stop (точка; main_object — площадь).
place: square_small
project: ../project.yaml
center: isochrones:walk-15-transit_stops-osm-n1501726533
scale: 30000
legend: 91
layers:
  point_1: {layer: poi_education, where: "poi_type = 'school'", within: isochrones:walk-15-transit_stops-osm-n1501726533, title: Школы}
  point_2: {layer: poi_education, where: "poi_type = 'kindergarten'", within: isochrones:walk-15-transit_stops-osm-n1501726533, title: Детские сады}
  reach_walk: {layer: isochrones, where: "object_id = 'isochrones:walk-15-transit_stops-osm-n1501726533'", title: 15 минут пешком от станции}
  stop: {layer: transit_stops, where: "object_id = 'transit_stops:osm-n1501726533'", title: Железнодорожная станция}
  road_express: {layer: roads, where: "road_class = 'express'"}
  road_main: {layer: roads, where: "road_class = 'main'"}
  road_district: {layer: roads, where: "road_class = 'district'"}
  railway: {layer: rail, where: "rail_class = 'main' AND coalesce(tunnel, 0) = 0"}
  green: {}
  water: {}
  blocks: {}
title: От станции Таганрог-II
out: images/k1-compare-a.png
