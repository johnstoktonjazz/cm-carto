# К1, карта 3b: сравнение под макет compare (место square_small, легенда 91 мм — одна на обе карты: compare_with, строки легенды — по обеим картам; на листе — карты 3a).
# 15 минут пешком от станции Таганрог-Пассажирский: школы и сады внутри изохроны. Масштаб общий с соседней картой (1:30 000 —
# помещается большая из двух изохрон), центр — свой, по изохроне. Станция — роль stop (точка; main_object — площадь).
place: square_small
project: ../project.yaml
center: isochrones:walk-15-transit_stops-osm-n9683398095
scale: 30000
legend: 91
layers:
  point_1: {layer: poi_education, where: "poi_type = 'school'", within: isochrones:walk-15-transit_stops-osm-n9683398095, title: Школы}
  point_2: {layer: poi_education, where: "poi_type = 'kindergarten'", within: isochrones:walk-15-transit_stops-osm-n9683398095, title: Детские сады}
  reach_walk: {layer: isochrones, where: "object_id = 'isochrones:walk-15-transit_stops-osm-n9683398095'", title: 15 минут пешком от станции}
  stop: {layer: transit_stops, where: "object_id = 'transit_stops:osm-n9683398095'", title: Железнодорожная станция}
  road_express: {layer: roads, where: "road_class = 'express'"}
  road_main: {layer: roads, where: "road_class = 'main'"}
  road_district: {layer: roads, where: "road_class = 'district'"}
  railway: {layer: rail, where: "rail_class = 'main' AND coalesce(tunnel, 0) = 0"}
  green: {}
  water: {}
  blocks: {layer: blocks, where: "status = 'reference'"}  # подложка — кварталы по улично-дорожной сети; кварталы ППТ — данные, не фон (К-027)
title: От станции Таганрог-Пассажирский
compare_with: [k1-compare-a.yaml]
out: images/k1-compare-b.png
