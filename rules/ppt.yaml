# Раскладка чертежа проекта планировки (DXF) в слои геопакета. Типовая: имена слоев — как принято в чертежах ППТ,
# проектных значений нет. Шаблоны — fnmatch без учета регистра, подчеркивание равно пробелу.
# Слой чертежа, которого нет ни в правилах, ни в ignore, попадает в отчет как «не распознано» и в предупреждение команды.
# Статуса здесь нет: его задает паспорт источника (<файл>.source.yaml), правила — только раскладка.
type: dxf
tolerance_m: 0.5            # разрыв контура не больше этого — замыкается и пишется в отчет; больше — «не распознано»
arc_tolerance_m: 0.05       # стрела прогиба при замене дуг и сплайнов ломаной
ignore:
  - "0"
  - "Defpoints"
  - "Рамка*"
  - "Штамп*"
  - "Размер*"
  - "Знак*"
  - "Подпис*"
  - "Сетка*"
  - "Текст*"
layers:
  - target: boundary_planning
    drawing: ["Граница_ППТ*", "Граница проекта планировки*"]
    geometry: polygon
    kind: граница ППТ
  - target: red_lines
    drawing: ["Красные_линии_существующ*"]
    geometry: line
    kind: красная линия существующая
    attrs: {state: existing}
  - target: red_lines
    drawing: ["Красные_линии_устанавливаем*", "Красные_линии_проектируем*"]
    geometry: line
    kind: красная линия устанавливаемая
    attrs: {state: planned}
  - target: blocks
    drawing: ["Кварталы*"]
    geometry: polygon
    kind: квартал ППТ
    name: "квартал {num}"
    number:
      layers: ["Номера_кварталов*"]
      pattern: "[0-9]+[а-яА-Я]?"
      attr: num
  - target: sites
    drawing: ["Зоны_размещения_ОКС*", "Зоны_планируемого_размещения*"]
    geometry: polygon
    kind: зона планируемого размещения ОКС
    name: "зона размещения {num}"
    number:
      layers: ["Номера_зон*"]
      pattern: "[0-9]+([.][0-9]+)?[а-яА-Я]?"
      attr: num
    attrs: {purpose: зона планируемого размещения объекта капитального строительства}
