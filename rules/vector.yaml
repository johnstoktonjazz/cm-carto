# Раскладка векторных файлов третьих лиц (SHP, GPKG) в слои геопакета. Типовая: слой или файл источника по шаблону
# имени → слой контракта; поля источника → атрибуты слоя. Статус, лицензия и подпись — из паспорта источника
# (<файл>.source.yaml): чужие данные — reference с license, оцифровка с картинки или слайда — digitized с digitized_from.
type: vector
layers:
  - {source: ["roads*", "дорог*", "улиц*"], target: roads, kind: улица, key: id, name: name, attrs: {road_class: class}}
  - {source: ["buildings*", "здани*", "застройк*"], target: buildings_osm, kind: здание, key: id, attrs: {floors: floors}}
  - {source: ["green*", "зелен*"], target: green, kind: озеленение, attrs: {green_class: class}}
  - {source: ["water*", "вод*"], target: water, kind: водный объект, attrs: {water_class: class}}
