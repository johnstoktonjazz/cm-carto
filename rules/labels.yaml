# Подписи объектов на карте (cm_carto/render/labels.py) — по TEXT.md верстки: кавычки «елочки», внутри „лапки“
# (T03); без «ё» (T01); «№» и номер через неразрывный пробел (text.yaml: nbsp.before_number: overlay движок
# верстки не склеивает, пробел ставит картограф); название без сокращений, которых нет в тексте слайда (MAPS.md,
# раздел 5); без лишних пробелов. Порядок применения — порядок ключей ниже. Слова — целиком; формы и сокращения — как
# написаны (заглавными), остальные списки — без учета регистра.

# Организационно-правовые формы и типы учреждений: на карте не пишутся.
org_forms: [МБДОУ, МАДОУ, МКДОУ, МДОУ, ГБДОУ, ДОУ, МБОУ, МАОУ, МКОУ, МОУ, ГБОУ, ГКОУ, ЧОУ, НОУ, АНО, МБУ, МАУ, МКУ,
            ГБУ, ГАУ, ГКУ, ФГБУ, ФГБОУ, ГБУЗ, ГАУЗ, МБУЗ, МУЗ, ФГБУЗ, ГБПОУ, ГАПОУ, ГБОУДО, МБОУДО, МБУДО, МАУДО,
            ООО, ОАО, ЗАО, ПАО, АО, ИП, НКО, МУП, ГУП, ФГУП]

# Сокращения → полная форма (до вставки «№»): строка целиком как слово.
expand:
  "д/с": детский сад
  "д / с": детский сад
  "СОШ": средняя общеобразовательная школа
  "им.": имени

# Слова, которые пишутся строчными не в начале подписи (в данных встречается «Средняя Общеобразовательная школа»).
lowercase: [детский, сад, средняя, общеобразовательная, основная, начальная, школа, лицей, гимназия, больница,
            поликлиника, городская]

# Номер после этих слов получает «№»: «детский сад 20» → «детский сад № 20». Номер — число в конце подписи или
# перед пробелом и кавычкой; «больница 1-приемный покой» не трогается.
numbered: [детский сад, школа, лицей, гимназия, больница, поликлиника]

# Перенос подписи (Measure.wrap): слово не отрывается от следующего — «Гимназия № 2 / имени Пушкина», а не
# «Гимназия № 2 имени / Пушкина». Предлоги, союзы и сокращения — из text.yaml: nbsp верстки, здесь только свое.
keep_with_next: [имени]
